# Cloudflare Tunnel configuration for LLM Router
#
# Setup:
#   1. Create a tunnel: cloudflared tunnel create llm-router
#   2. Copy the credentials file to ./deploy/cloudflared/credentials.json
#   3. Configure your Cloudflare DNS to point your domain to the tunnel
#   4. Start with: cd deploy/compose && docker compose -f docker-compose.yml -f ../cloudflared/docker-compose.cloudflared.yml up -d
#      Or from project root: docker compose -f deploy/compose/docker-compose.yml -f deploy/cloudflared/docker-compose.cloudflared.yml up -d
#
# Docs: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/

tunnel: ${TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Monitor frontend (nginx serves at port 4022 internally)
  - hostname: ${TUNNEL_DOMAIN}
    service: http://nginx:4022

  # Fallback — deny all other requests
  - service: http_status:404
